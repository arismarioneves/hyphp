# Checagens do HyPHP. Só roda em push na main (depois do merge feito pelo dono)
# e por disparo manual. Sem pull_request/pull_request_target: PR de terceiros
# não executa nada. Sem segredos e sem artefatos: este workflow não gera build
# de distribuição (isso é o workflow manual de release, na M3).
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PKGS: . ./cmd/... ./services/... ./internal/...

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm run build já roda tsc; o vitest roda só aqui porque o frontend não muda por SO.
      - name: frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx vitest run
      - run: go build $PKGS
      - run: go vet $PKGS
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 $PKGS
      - run: go test -count=1 ./cmd/... ./services/... ./internal/...

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      # O main precisa do cgo do Wails (Cocoa/WebKit): só compila num Mac.
      - run: go build $PKGS
      - run: go vet $PKGS
      # O stub darwin de update (M3) sempre retorna erro até a M3 implementá-lo,
      # então o `if err != nil` no chamador é sempre verdadeiro no Mac. O SA4023
      # volta ao job do Mac quando esse stub sumir.
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 -checks inherit,-SA4023 $PKGS
      - run: go test -count=1 ./cmd/... ./services/... ./internal/...

  # O roteiro manual da M1 de ponta a ponta num Mac Apple Silicon de verdade:
  # o .app empacotado, runtimes do Homebrew, projeto servido, banco, e-mail,
  # phpMyAdmin e a limpeza de órfãos depois de um kill -9. O runner tem sessão
  # gráfica, então o app abre como no Mac do usuário. O .app não sai do job.
  macos-e2e:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # O wails3 da mesma versão do go.mod, como no build.yml.
      - name: wails3
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
      - name: package
        run: wails3 task darwin:package
      - name: e2e
        run: bash .github/scripts/e2e-macos.sh bin/HyPHP.app
