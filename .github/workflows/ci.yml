# Checagens do HyPHP. Só roda em push na main (depois do merge feito pelo dono)
# e por disparo manual. Sem pull_request/pull_request_target: PR de terceiros
# não executa nada. Sem segredos e sem artefatos: este workflow não gera build
# de distribuição (isso é o build.yml).
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PKGS: . ./cmd/... ./services/... ./internal/...

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm run build já roda tsc; o vitest roda só aqui porque o frontend não muda por SO.
      - name: frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx vitest run
      - run: go build $PKGS
      - run: go vet $PKGS
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 $PKGS
      - run: go test -count=1 ./cmd/... ./services/... ./internal/...

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      # O main precisa do cgo do Wails (Cocoa/WebKit): só compila num Mac.
      - run: go build $PKGS
      - run: go vet $PKGS
      # O RemoveWildcardDNS do Mac sempre devolve erro (lá a regra de DNS sai
      # pelo "Remover do sistema"), então o `if err != nil` do SettingsService
      # é sempre verdadeiro no Mac.
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 -checks inherit,-SA4023 $PKGS
      - run: go test -count=1 ./cmd/... ./services/... ./internal/...

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # O Wails compila contra o GTK4 e o WebKitGTK 6.0 no Linux.
      - name: dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: go build $PKGS
      - run: go vet $PKGS
      # Como no Mac, o RemoveWildcardDNS do Linux sempre devolve erro, então o
      # `if err != nil` do SettingsService é sempre verdadeiro.
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 -checks inherit,-SA4023 $PKGS
      # Um D-Bus de sessão só do job: os testes da bandeja e do tema fazem o
      # papel do painel e do portal nele.
      - run: dbus-run-session -- go test -count=1 ./cmd/... ./services/... ./internal/...

  # O roteiro manual da M1, da M2 e da M3 de ponta a ponta num Mac Apple
  # Silicon de verdade: o dmg instalado pelo install.sh, runtimes do Homebrew,
  # projeto servido, banco, e-mail, phpMyAdmin, a regra de DNS, a CA e o PATH
  # pelo helper (o sudo do runner faz o papel da janela de senha), HTTPS, a
  # limpeza de órfãos depois de um kill -9, um update aplicado pelo
  # atualizador, a remoção do sistema e a desinstalação pelo uninstall.sh. O
  # runner tem sessão gráfica, então o app abre como no Mac do usuário. O dmg
  # não sai do job.
  macos-e2e:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # O wails3 da mesma versão do go.mod, como no build.yml.
      - name: wails3
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
      - name: package
        run: wails3 task darwin:package:dmg
      - name: e2e
        run: bash .github/scripts/e2e-macos.sh bin/HyPHP.dmg

  # O roteiro do Linux sem tela num runner ubuntu-24.04: runtimes do Homebrew,
  # o app do build local num Xvfb, projeto servido na 8080, banco, e-mail,
  # phpMyAdmin, a limpeza de órfãos depois de um kill -9 e nginx e MariaDB
  # instalados com o app aberto. As portas 80 e 443, o hosts, a CA e o PATH
  # pedem privilégio de administrador e não entram.
  linux-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev xvfb xauth
      # O wails3 da mesma versão do go.mod, como no build.yml.
      - name: wails3
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
      - name: build
        run: wails3 task linux:build
      - name: e2e
        run: bash .github/scripts/e2e-linux.sh
