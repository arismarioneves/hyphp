version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Imagem Docker do build cruzado (fora do Linux ou sem compilador C).
  CROSS_IMAGE: wails-cross

tasks:
  dev:deps:
    summary: Builds what `wails3 dev` needs on Linux (CLI)
    cmds:
      - task: build:cli

  apparmor:
    summary: Installs the AppArmor profile that lets the local build's WebKit sandbox the page (Ubuntu 24.04 and derivatives; asks for sudo)
    preconditions:
      - sh: command -v apparmor_parser >/dev/null 2>&1
        msg: "apparmor_parser not found: this system does not use AppArmor, and the profile is not needed"
    cmds:
      # Perfil com nome próprio, preso ao caminho do bin/hyphp deste
      # repositório.
      - sed -e 's|@NOME@|hyphp-dev|g' -e 's|@EXE@|{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}|g' build/linux/hyphp.apparmor | sudo tee /etc/apparmor.d/hyphp-dev >/dev/null
      - sudo apparmor_parser -r /etc/apparmor.d/hyphp-dev

  polkit:
    summary: Installs the polkit action that names HyPHP in the local build's password prompt (asks for sudo)
    preconditions:
      - sh: test -d /usr/share/polkit-1/actions
        msg: "/usr/share/polkit-1/actions not found: install polkit and pkexec"
    cmds:
      # Action com id próprio, presa ao caminho do bin/hyphp-helper deste
      # repositório. O polkit relê a pasta sozinho.
      - sed -e 's|@ID@|com.hyphp.app.dev.helper|g' -e 's|@HELPER@|{{.ROOT_DIR}}/{{.BIN_DIR}}/hyphp-helper|g' build/linux/hyphp.policy | sudo tee /usr/share/polkit-1/actions/com.hyphp.app.dev.policy >/dev/null

  build:
    summary: Builds the application for Linux
    cmds:
      # Linux requires CGO - use Docker when:
      # 1. Cross-compiling from non-Linux, OR
      # 2. No C compiler is available, OR
      # 3. Target architecture differs from host architecture (cross-arch compilation)
      - task: '{{if and (eq OS "linux") (eq .HAS_CC "true") (eq .TARGET_ARCH ARCH)}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Determine target architecture (defaults to host ARCH if not specified)
      TARGET_ARCH: '{{.ARCH | default ARCH}}'
      # Check if a C compiler is available (gcc or clang) — cross-platform via wails3 tool
      HAS_CC:
        sh: 'wails3 tool has "gcc|clang"'

  build:native:
    summary: Builds the application natively on Linux
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o {{.OUTPUT}}'
      # A CLI em cli/, onde o cliExe e o `hyphp app` a procuram, e o helper ao
      # lado do app.
      - task: build:cli
      - task: build:helper
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  build:docker:
    summary: Builds for Linux using Docker (for non-Linux hosts or when no C compiler available)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation to Linux. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} "{{.CROSS_IMAGE}}" linux {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.APP_NAME}}-linux-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
      # CLI e helper não usam cgo: compilam fora do contêiner.
      - task: build:cli
        vars:
          ARCH: '{{.DOCKER_ARCH}}'
      - task: build:helper
        vars:
          ARCH: '{{.DOCKER_ARCH}}'
    vars:
      DOCKER_ARCH: '{{.ARCH | default "amd64"}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Generate Docker volume mounts: Go module cache + go.mod replace directives
      # Uses wails3 tool docker-mounts for cross-platform compatibility (Windows/Linux/macOS)
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  package:
    summary: Packages the application for Linux (bin/hyphp.deb)
    deps:
      - task: build
    cmds:
      - task: generate:system-files
      - task: generate:deb

  generate:system-files:
    summary: Renders the AppArmor profile and the polkit action with the installed paths (bin/linux)
    internal: true
    cmds:
      # O nfpm não troca conteúdo de arquivo: os modelos das tasks apparmor e
      # polkit saem prontos para /usr/lib/hyphp, nos caminhos do nfpm.yaml.
      - mkdir -p bin/linux
      - sed -e 's|@NOME@|hyphp|g' -e 's|@EXE@|/usr/lib/hyphp/hyphp|g' build/linux/hyphp.apparmor > bin/linux/hyphp.apparmor
      - sed -e 's|@ID@|com.hyphp.app.helper|g' -e 's|@HELPER@|/usr/lib/hyphp/hyphp-helper|g' build/linux/hyphp.policy > bin/linux/com.hyphp.app.helper.policy

  generate:deb:
    summary: Creates the deb package
    cmds:
      - wails3 tool package -name "{{.APP_NAME}}" -format deb -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'

  build:cli:
    summary: Builds the CLI (bin/cli/hyphp)
    cmds:
      # A CLI é um binário de terminal à parte, sem Wails nem cgo.
      - go build -trimpath -buildvcs=false -ldflags="-w -s" -o "{{.BIN_DIR}}/cli/hyphp" ./cmd/hyphp
    env:
      GOOS: linux
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default ARCH}}'

  build:helper:
    summary: Builds the elevated helper (bin/hyphp-helper)
    cmds:
      - go build -trimpath -buildvcs=false -ldflags="-w -s" -o "{{.BIN_DIR}}/hyphp-helper" ./cmd/hyphp-helper
    env:
      GOOS: linux
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default ARCH}}'
