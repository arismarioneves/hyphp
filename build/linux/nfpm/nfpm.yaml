name: "hyphp"
arch: "amd64"
platform: "linux"
# Igual ao internal/version.Current: o hyphp-release confere, e o Version do
# control sai sem revisão para o updater comparar com a versão do app.
version: "4.2.0"
section: "devel"
priority: "optional"
maintainer: "Arismário Neves <contato@arismario.dev>"
homepage: "https://ae8.com.br/hyphp/"
license: "MIT"
description: |
  Local PHP development environment
  HyPHP runs several PHP versions side by side, and each project declares
  its own. It serves sites with Apache or nginx, runs MySQL or MariaDB and
  catches outgoing mail with Mailpit, without Docker.

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - libnss3-tools
  - pkexec
  - ca-certificates

contents:
  - src: "./bin/hyphp"
    dst: "/usr/lib/hyphp/hyphp"
    file_info:
      mode: 0755
  - src: "./bin/hyphp-helper"
    dst: "/usr/lib/hyphp/hyphp-helper"
    file_info:
      mode: 0755
  - src: "./bin/cli/hyphp"
    dst: "/usr/lib/hyphp/cli/hyphp"
    file_info:
      mode: 0755
  # A CLI no PATH; o app fica fora dele, só pelo .desktop.
  - src: "/usr/lib/hyphp/cli/hyphp"
    dst: "/usr/bin/hyphp"
    type: symlink
  # Os demais com 0644 fixo: o modo do checkout depende do umask de quem
  # compila.
  - src: "./build/linux/com.hyphp.app.desktop"
    dst: "/usr/share/applications/com.hyphp.app.desktop"
    file_info:
      mode: 0644
  - src: "./build/appicon.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/hyphp.svg"
    file_info:
      mode: 0644
  # Arquivo comum e não conffile: o apt remove o leva junto, sem esperar o
  # purge, e o upgrade o troca sem perguntar.
  - src: "./bin/linux/hyphp.apparmor"
    dst: "/etc/apparmor.d/hyphp"
    file_info:
      mode: 0644
  - src: "./bin/linux/com.hyphp.app.helper.policy"
    dst: "/usr/share/polkit-1/actions/com.hyphp.app.helper.policy"
    file_info:
      mode: 0644

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  preremove: "./build/linux/nfpm/scripts/preremove.sh"
  postremove: "./build/linux/nfpm/scripts/postremove.sh"
